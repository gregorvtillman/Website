<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gregor Tillman — Architectural Designer">
  <title>Gregor Tillman — Architectural Designer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #303E4A;
      color: #F5F0E0;
      font-family: Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 14px;
      line-height: 1.35;
    }

    .name {
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .location {
      text-align: right;
      color: #555;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:32px;
    }

    .content {
      width: 100%;
      max-width: 1200px;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 11vw, 170px);
      line-height: 0.86;
      font-weight: 400;
      letter-spacing: -0.075em;
      max-width: 1100px;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: #171717;
      margin: 46px 0 22px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 32px;
      font-size: 14px;
      line-height: 1.4;
    }

    .status {
      color: #555;
    }

    footer {
      padding: 28px 32px;
      font-size: 12px;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 600px) {
      header,
      main,
      footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      header {
        padding-top: 22px;
      }

      main {
        padding-top: 10vh;
        padding-bottom: 10vh;
      }

      .bottom {
        flex-direction: column;
        gap: 8px;
      }

      footer {
        padding-bottom: 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="content">
      <h1>Under Construction</h1>

      <div class="rule"></div>

      <div class="bottom">
        <div class="status">Currently under construction.</div>
      </div>
    </div>
  </main>

  <footer>
    <div>© 2026 Gregor Vincent Tillman</div>
  </footer>
</body>
</html>
