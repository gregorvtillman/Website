<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://use.typekit.net/juj7jul.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gregor Tillman — Architectural Designer">
  <title>Gregor Tillman</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #303E4A;
      color: #F5F0E0;
      font-family: Cartograph-cf, Helvetica, Arial, sans-serif;
      font-weight:300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      letter-spacing: 0.4em;
    }

    header {
      padding: 28px 32px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 14px;
      line-height: 1.35;
    }

    .name {
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .location {
      text-align: right;
      color: #555;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:32px;
    }

    .content {
      width: 100%;
      max-width: none;
    }

    h1 {
    margin: 0;
    width: 100%;
    font-size: 3.8vw;
    line-height: 1.2;
    font-weight: 300;
    letter-spacing: 0.4em;
    max-width: none;
    text-align: center;
  }

  h1 span {
    white-space: nowrap;
  }
    .rule {
      width: 100%;
      height: 1px;
      background: #171717;
      margin: 46px 0 22px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      gap: 32px;
      font-size: 14px;
      line-height: 1.4;
    }

    .status {
      color: #555;
    }

    footer {
      font-family: capitolina, Helvetica, Arial, serif;
      padding: 28px 32px;
      font-size: 10px;
      color: #9CAFBF;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 600px) {
      header,
      main,
      footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      header {
        padding-top: 22px;
      }

      main {
        padding-top: 10vh;
        padding-bottom: 10vh;
      }

      .bottom {
        flex-direction: column;
        gap: 8px;
      }

      footer {
        padding-bottom: 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="content">
      <h1>
        <span>[GREGOR VINCENT TILLMAN</span><br>
        <span>UNDER CONSTRUCTION.&nbsp;&nbsp;&nbsp;]</span>
     </h1>
    </div>
  </main>

  <footer>
    <div>© 2026 Gregor Vincent Tillman</div>
  </footer>
</body>
</html>
